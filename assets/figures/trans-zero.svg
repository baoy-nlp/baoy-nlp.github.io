<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<rect width="960" height="540" fill="white"/>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}
 .title{font-size:34px;font-weight:700}
 .sub{font-size:26px;fill:#59636e}
 .lbl{font-size:34px;font-weight:600}
 .small{font-size:26px}
 .cap{font-size:26px;fill:#59636e}
 .box{fill:#eaf2fb;stroke:#0b5cad;stroke-width:2}
 .line{stroke:#0b5cad;stroke-width:4;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b5cad"/></marker></defs>
<text x="48" y="58" class="title">Self-play: one LLM, no parallel data</text>
<text x="48" y="100" class="sub">Search: selection &#8594; expansion &#8594; simulation &#8594; back-propagation</text>

<rect x="35" y="160" width="190" height="160" rx="12" class="box"/>
<rect x="268" y="160" width="190" height="160" rx="12" class="box"/>
<rect x="502" y="160" width="190" height="160" rx="12" class="box"/>
<rect x="735" y="160" width="190" height="160" rx="12" class="box"/>
<path d="M228 240H262" class="line"/>
<path d="M461 240H496" class="line"/>
<path d="M695 240H729" class="line"/>

<text x="130" y="230" class="lbl" text-anchor="middle">Initiate</text>
<text x="130" y="272" class="small" text-anchor="middle">tree from LLM</text>
<text x="363" y="230" class="lbl" text-anchor="middle">Expand</text>
<text x="363" y="272" class="small" text-anchor="middle">merge / mutate</text>
<text x="597" y="230" class="lbl" text-anchor="middle">Simulate</text>
<text x="597" y="272" class="small" text-anchor="middle">back-propagate</text>
<text x="830" y="230" class="lbl" text-anchor="middle">Tree to</text>
<text x="830" y="272" class="small" text-anchor="middle">preferences</text>

<text x="48" y="372" class="cap">Candidates are expanded by merging and mutating, scored by</text>
<text x="48" y="404" class="cap">simulation, then the tree is harvested into preference pairs.</text>
<text x="48" y="482" class="cap">Schematic &#183; simplified from Figure 1 of the paper;</text>
<text x="48" y="514" class="cap">not an original figure.</text>
</svg>
