  <text x="40" y="288" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#59636e">Each dimension targets a core aspect of complex,</text>
  <text x="40" y="320" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#59636e">long-horizon agent performance.</text>

  <rect x="40" y="356" width="880" height="108" rx="12" fill="#eaf2fb" stroke="#0b5cad" stroke-width="2"/>
  <text x="64" y="400" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#0b5cad">Three model sizes: Pro · Lite · Mini</text>
  <text x="64" y="436" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#59636e">Pick the balance of performance and speed you need.</text>

  <text x="40" y="506" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#59636e">Adapted schematic · from the report's own framework text</text>
