  <text x="140" y="168" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Science</text>
  <text x="140" y="204" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Discovery</text>

  <rect x="266" y="120" width="200" height="116" rx="12" fill="#eaf2fb" stroke="#0b5cad" stroke-width="2"/>
  <text x="366" y="168" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Vibe</text>
  <text x="366" y="204" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Coding</text>

  <rect x="492" y="120" width="200" height="116" rx="12" fill="#eaf2fb" stroke="#0b5cad" stroke-width="2"/>
  <text x="592" y="168" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Context</text>
  <text x="592" y="204" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Learning</text>

  <rect x="718" y="120" width="200" height="116" rx="12" fill="#eaf2fb" stroke="#0b5cad" stroke-width="2"/>
  <text x="818" y="168" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0b5cad" text-anchor="middle">Real-World</text>
