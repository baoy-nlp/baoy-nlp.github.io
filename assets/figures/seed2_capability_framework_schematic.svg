<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="1920" height="1080">
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <text x="40" y="52" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#1f2937">Seed2.0: real-world complexity</text>
  <text x="40" y="88" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#59636e">A framework that is both a benchmark suite and a development guide</text>

