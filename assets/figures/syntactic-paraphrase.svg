<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b5cad"/></marker></defs>
<text x="48" y="58" class="title">Sample a template, then match the meaning</text>
<text x="48" y="100" class="sub">A syntactic-template latent variable links the two spaces</text>
<text x="48" y="146" class="sub">STEP 1 &#183; PRIOR</text>
<text x="512" y="146" class="sub">STEP 2 &#183; POSTERIOR</text>

<rect x="48" y="168" width="400" height="140" rx="12" class="box"/>
<rect x="512" y="168" width="400" height="140" rx="12" class="box"/>
<path d="M456 238H504" class="line"/>

<text x="248" y="232" class="lbl" text-anchor="middle">Sample a syntactic</text>
<text x="248" y="274" class="lbl" text-anchor="middle">template</text>
<text x="712" y="232" class="lbl" text-anchor="middle">Sample the syntactic</text>
<text x="712" y="274" class="lbl" text-anchor="middle">representation</text>

<text x="48" y="348" class="sub">for diverse templates</text>
<text x="512" y="348" class="sub">matched to the meaning</text>

